name: ML pipeline

on:
  push:
    branches: [main]
    paths: ["ml/**", "assets/chemsort/**", ".github/workflows/ml.yml"]
  pull_request:
    branches: [main]
    paths: ["ml/**", "assets/chemsort/**", ".github/workflows/ml.yml"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Flutter model assets
        run: python -m tools.validate_chemsort_assets --project-root .. --require-flashcards
